    <div class="game-list">
        <!-- 아까 만든 2048 게임으로 가는 링크 버튼 -->
        <a href="/2048" class="game-btn">2048 퍼즐 게임</a>
        
        <!-- 나중에 추가할 게임 자리 (미리 주소만 만들어두기) -->
        <a href="#" class="game-btn" style="background:#ccc; cursor:not-allowed;">공룡 게임 (준비중)</a>

</html>
